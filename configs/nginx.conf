# FER Data Collection - Nginx reverse proxy configuration
# Copy to /etc/nginx/sites-available/fer-collect
# ln -s /etc/nginx/sites-available/fer-collect /etc/nginx/sites-enabled/

upstream fer_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;  # Replace with your domain
    
    # SSL certificates (use certbot or your own)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
    # Logging
    access_log /var/log/nginx/fer-collect.access.log;
    error_log /var/log/nginx/fer-collect.error.log;
    
    # Client body size for video uploads (100MB max)
    client_max_body_size 100M;
    
    # Timeouts for long uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Main application
    location / {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # SSE endpoint - disable buffering
    location /session/cues {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        # Long timeout for SSE
        proxy_read_timeout 86400s;
    }
    
    # Upload endpoint - extended timeouts
    location /upload {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeout for uploads
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Don't buffer uploads
        proxy_request_buffering off;
    }
}
