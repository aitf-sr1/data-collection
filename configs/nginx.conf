# FER Data Collection - Nginx reverse proxy configuration
# Copy to /etc/nginx/sites-available/fer-collect
# ln -s /etc/nginx/sites-available/fer-collect /etc/nginx/sites-enabled/
#
# After copying, run: sudo certbot --nginx -d YOUR_DOMAIN
# Certbot will automatically add SSL configuration

upstream fer_backend {
    # Backend server via Tailscale - replace with your lab machine's Tailscale IP
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain before running certbot

    # Logging
    access_log /var/log/nginx/fer-collect.access.log;
    error_log /var/log/nginx/fer-collect.error.log;

    # Client body size for video uploads (100MB max)
    client_max_body_size 100M;

    # Timeouts for long uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Main application
    location / {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint - disable buffering
    location /session/cues {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Long timeout for SSE
        proxy_read_timeout 86400s;
    }

    # Upload endpoint - extended timeouts
    location /upload {
        proxy_pass http://fer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for uploads
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Don't buffer uploads
        proxy_request_buffering off;
    }
}
